services:
  neo4j:
    image: neo4j:5-community
    ports:
      # Loopback-only: the app reaches Neo4j over the compose network as
      # neo4j:7687. Publishing these on 0.0.0.0 exposes the database, with the
      # committed default password, to anything that can reach this host.
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/corpgraph
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  app:
    build: .
    depends_on:
      - neo4j
    ports:
      - "8501:8501"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=corpgraph
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    command: streamlit run app.py --server.address=0.0.0.0

volumes:
  neo4j_data:
